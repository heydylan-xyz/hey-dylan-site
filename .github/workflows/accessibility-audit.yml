name: Accessibility Audit
on: [push]

jobs:
  pa11y-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Build Site
        run: npm run build

      - name: Run Accessibility Audit
        run: |
          # Serve the 'dist' folder instead of '_site'
          npx serve dist -l 8080 & 
          sleep 5
          # Look for the sitemap in /common/sitemap.xml
          npx pa11y-ci --sitemap http://localhost:8080/common/sitemap.xml --threshold 0 --chrome-launch-config '{"args": ["--no-sandbox"]}'
